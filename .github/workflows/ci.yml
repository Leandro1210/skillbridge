name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Django system check
        env:
          DJANGO_SECRET_KEY: ci-only-placeholder-key-not-for-production
          DJANGO_DEBUG: "False"
          DATABASE_URL: sqlite:///ci.sqlite3
        run: python manage.py check
      
      - name: Testes + cobertura
        run: pytest
      
      - name: Guardar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: coverage.xml
        

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes + cobertura
        run: npm run coverage

      # O Vitest grava os caminhos relativos a frontend/ (SF:src/App.jsx), mas o
      # SonarQube analisa a partir da raiz do repositório (frontend/src/App.jsx).
      - name: Ajustar caminhos do relatório de cobertura
        run: sed -i 's#^SF:#SF:frontend/#' coverage/lcov.info

      - name: Guardar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/lcov.info

      - name: Build
        run: npm run build

  sonar:
    name: SonarQube Cloud
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar cobertura do backend
        uses: actions/download-artifact@v4
        with:
          name: coverage-backend

      - name: Baixar cobertura do frontend
        uses: actions/download-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8.3.0
