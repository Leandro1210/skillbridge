sonar.organization=leandro1210
sonar.projectKey=Leandro1210_skillbridge
sonar.projectName=SkillBridge

# Código-fonte (backend + frontend) e testes, separados
sonar.sources=core,skillbridge,frontend/src
sonar.tests=core/tests
sonar.exclusions=**/migrations/**,**/__pycache__/**,core/tests/**,frontend/src/assets/**
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Cobertura do backend (gerada pelo pytest-cov no CI)
sonar.python.coverage.reportPaths=coverage.xml

# Fora da métrica de cobertura por enquanto:
# - frontend: ainda sem testes
# - settings/asgi/wsgi/supabase_config e o seed_demo: configuração/script, não regra de negócio
sonar.coverage.exclusions=frontend/**,skillbridge/settings*.py,skillbridge/asgi.py,skillbridge/wsgi.py,skillbridge/supabase_config.py,core/management/**

# @theme é diretiva do Tailwind CSS 4, não erro
sonar.issue.ignore.multicriteria=tw
sonar.issue.ignore.multicriteria.tw.ruleKey=css:S4662
sonar.issue.ignore.multicriteria.tw.resourceKey=frontend/src/index.css
