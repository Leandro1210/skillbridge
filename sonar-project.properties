sonar.organization=leandro1210
sonar.projectKey=Leandro1210_skillbridge
sonar.projectName=SkillBridge

# Código-fonte (backend + frontend) e testes, separados.
# frontend/src aparece nos dois: os *.test.js(x) e o setup dos testes contam
# como teste, e todo o resto como código-fonte.
sonar.sources=core,skillbridge,frontend/src
sonar.tests=core/tests,frontend/src
sonar.test.inclusions=core/tests/**,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/test/**
sonar.exclusions=**/migrations/**,**/__pycache__/**,core/tests/**,frontend/src/assets/**,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/test/**
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Cobertura do backend (pytest-cov) e do frontend (Vitest), gerada no CI
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Fora da métrica de cobertura: configuração e scripts, não regra de negócio
# (settings/asgi/wsgi/supabase_config, o seed_demo e o ponto de entrada do React)
sonar.coverage.exclusions=skillbridge/settings*.py,skillbridge/asgi.py,skillbridge/wsgi.py,skillbridge/supabase_config.py,core/management/**,frontend/src/main.jsx

# @theme é diretiva do Tailwind CSS 4, não erro
sonar.issue.ignore.multicriteria=tw
sonar.issue.ignore.multicriteria.tw.ruleKey=css:S4662
sonar.issue.ignore.multicriteria.tw.resourceKey=frontend/src/index.css
